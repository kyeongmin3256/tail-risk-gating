services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tailrisk
      POSTGRES_USER: tailrisk
      POSTGRES_PASSWORD: tailrisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailrisk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs:ro
      - ./data:/app/data:ro
    environment:
      FRED_API_KEY: ${FRED_API_KEY:-}
      DATABASE_URL: postgresql+psycopg2://tailrisk:tailrisk@db:5432/tailrisk
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
