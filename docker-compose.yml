version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tailrisk
      POSTGRES_USER: tailrisk
      POSTGRES_PASSWORD: tailrisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailrisk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
