# Tail Risk Gating System Configuration

data:
  # Date range for historical data
  start_date: "2006-01-01"
  end_date: null  # null = today

  # Yahoo Finance tickers
  tickers:
    spy: "SPY"
    vix: "^VIX"
    vvix: "^VVIX"
    vix9d: "^VIX9D"
    vix3m: "^VIX3M"
    skew: "^SKEW"
    hyg: "HYG"
    ief: "IEF"
    dxy: "UUP"  # Dollar index proxy ETF (DX-Y.NYB can be unreliable)

  # FRED series IDs
  fred_series:
    treasury_2y: "DGS2"
    treasury_10y: "DGS10"

  # FRED API key (get free at https://fred.stlouisfed.org/docs/api/api_key.html)
  fred_api_key: null  # Set via environment variable FRED_API_KEY

features:
  # Realized volatility windows
  realized_vol_windows: [5, 10, 20]

  # Return momentum windows
  momentum_windows: [1, 5, 10, 20]

  # Moving average for distance calculation
  ma_window: 50

  # Volume ratio baseline window
  volume_ma_window: 20

  # Rolling drawdown window
  drawdown_window: 5

  # Credit spread rolling window
  credit_spread_window: 5

strategy:
  # Default strategy: short ATM straddle on SPY
  name: "short_straddle_spy"

  # Default loss threshold (user can override)
  default_threshold: -0.04  # -4%

  # Default time horizon in trading days
  default_horizon: 5

  # Label: fraction of worst outcomes to flag
  # (used for binary classification target)
  worst_quantile: 0.10  # bottom 10% of outcomes

model:
  # Train/val/test split
  train_end: "2019-12-31"
  val_end: "2021-12-31"
  # Everything after val_end is test

  # Walk-forward settings
  walk_forward:
    retrain_frequency: 63  # ~quarterly in trading days
    min_train_size: 756    # ~3 years minimum

  # Random seed for reproducibility
  seed: 42

database:
  host: "localhost"
  port: 5432
  name: "tailrisk"
  user: "tailrisk"
  password: "tailrisk"  # Change in production

gating:
  # Primary gating policy per loss-tolerance model (percent magnitude).
  by_threshold:
    "2":
      mode: soft
      gate_threshold: 0.20
    "4":
      mode: hard
      gate_threshold: 0.15
    "6":
      mode: hard
      gate_threshold: 0.15
    "8":
      mode: hard
      gate_threshold: 0.15
